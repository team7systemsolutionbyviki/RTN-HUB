<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | RTN LETZZ NATURE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-top: 40px;
        }
        .contact-info-card {
            background: var(--white);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }
        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }
        .info-item i {
            font-size: 24px;
            color: var(--primary-color);
            margin-top: 5px;
        }
        .info-item h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }
        .info-item p {
            color: var(--text-light);
        }
        .map-container {
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            background: #eee;
            height: 100%;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @media (max-width: 768px) {
            .contact-container {
                grid-template-columns: 1fr;
            }
            .map-container {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- Header (Same) -->
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo"><img src="images/logo.jpg" alt="Logo"></a>
            <nav class="nav-links" id="nav-links">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="shop.html?category=Offers">Offers</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
            <div class="header-icons">
                <button class="icon-btn cart-icon" onclick="openCartModal()">
                    <i class="fas fa-shopping-bag"></i><span class="badge cart-count" style="display:none;">0</span>
                </button>
            </div>
        </div>
    </header>

    <section class="section" style="padding: 40px 0 20px; background: var(--accent-color);">
        <div class="container" style="text-align: center;">
            <img src="images/logo.png" alt="Logo" style="height: 180px; display: block; margin: 0 auto 20px auto; border-radius: 12px;">
            <h1>Get In Touch</h1>
            <p>We'd love to hear from you. Our team is always here to help.</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="contact-container">
                <div class="contact-info-card">
                    <h2 style="margin-bottom: 30px;">Contact Information</h2>
                    
                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <div>
                            <h3>Our Store</h3>
                            <p class="shop-address-text">Loading...</p>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <i class="fas fa-phone-alt"></i>
                        <div>
                            <h3>Phone / WhatsApp</h3>
                            <p class="shop-phone-text">Loading...</p>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <div>
                            <h3>Email</h3>
                            <p class="shop-email-text">Loading...</p>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <i class="far fa-clock"></i>
                        <div>
                            <h3>Business Hours</h3>
                            <p id="shop-hours-text">Loading...</p>
                        </div>
                    </div>
                    
                    <button class="btn-whatsapp-order" style="width:100%; margin-top:20px; padding:15px; font-size:16px;" onclick="sendGeneralInquiry()">
                        <i class="fab fa-whatsapp" style="font-size:20px;"></i> Chat with us on WhatsApp
                    </button>
                </div>
                
                <div class="map-container" id="map-container">
                    <!-- Google Maps Placeholder, can be replaced with real iframe -->
                    <div style="text-align:center; padding: 20px;">
                        <i class="fas fa-map" style="font-size:48px; color:var(--text-light); margin-bottom:15px;"></i>
                        <h3 style="color:var(--text-light)">Interactive Map</h3>
                        <p style="color:var(--text-light); font-size:14px;">(Map will appear here if configured in admin)</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <!-- Firebase Integration -->
    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/whatsapp.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hoursEl = document.getElementById('shop-hours-text');
            if (hoursEl && SHOP_CONFIG.hours) {
                hoursEl.textContent = SHOP_CONFIG.hours;
            }
            
            const mapContainer = document.getElementById('map-container');
            if (mapContainer && SHOP_CONFIG.mapIframe) {
                mapContainer.innerHTML = SHOP_CONFIG.mapIframe;
                const iframe = mapContainer.querySelector('iframe');
                if (iframe) {
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    iframe.style.minHeight = '400px';
                }
            }
        });
    </script>
</body>
</html>
